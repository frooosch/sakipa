<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakipa Satellite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23e2793a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;1,700;1,800&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,800,100,1;1,9..144,900,100,1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a 1970s mission-control console. Dark ink chassis, cream instrument panels,
   card-colour coding (mustard missions, sky orbits, salmon parts, orange events, lilac facts),
   and the rainbow "launch stripe" from the cards as the recurring motif. Single dark theme by choice. */
:root {
  --ink: #241d27;
  --ink-2: #312838;
  --ink-3: #3e3445;
  --paper: #fff1d8;
  --paper-2: #f6e2c0;
  --mustard: #eab43b;
  --orange: #e2793a;
  --salmon: #f2ab95;
  --sky: #9db3cf;
  --lilac: #c9acd2;
  --teal: #7fb8a6;
  --good: #7fb8a6;
  --bad: #e2603a;
  --display: 'Fraunces', 'Cooper Black', 'Georgia', serif;
  --body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Space Mono', 'Courier New', monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.4; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; min-height: 100%; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
a { color: var(--mustard); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.display { font-family: var(--display); font-style: italic; font-weight: 900; font-variation-settings: 'SOFT' 100, 'WONK' 1; letter-spacing: -0.01em; }
.eyebrow { font-family: var(--body); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
#app.veiled main, #app.veiled .scores { filter: blur(22px); pointer-events: none; }

/* ---------- buttons ---------- */
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 800; background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 #0006; transition: transform .08s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0006; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.go { background: var(--orange); color: var(--ink); }
.btn.mustard { background: var(--mustard); }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px #fff3; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.big { padding: 14px 28px; font-size: 18px; }

/* ---------- header ---------- */
header.bar { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: #1b151dcc; backdrop-filter: blur(4px); border-bottom: 1px solid #fff1; position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-size: 28px; color: var(--mustard); white-space: nowrap; }
.swoosh { width: 120px; height: 26px; flex: none; }
.roundbox { display: flex; align-items: center; gap: 10px; }
.round-dial { font-family: var(--mono); font-weight: 700; background: var(--ink-2); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
.round-dial b { color: var(--mustard); }
.event-chip { display: flex; align-items: center; gap: 8px; background: var(--orange); color: var(--ink); border-radius: 999px; padding: 5px 14px 5px 6px; border: 0; font-weight: 800; }
.event-chip img { width: 26px; height: 36px; border-radius: 4px; object-fit: cover; }
.scores { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.score { display: flex; align-items: center; gap: 8px; background: var(--ink-2); border-radius: 12px; padding: 6px 12px; border: 2px solid transparent; }
.score.active { border-color: var(--mustard); }
.score .dot { width: 10px; height: 10px; border-radius: 50%; }
.score .nm { font-weight: 800; font-size: 13px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .vals { font-family: var(--mono); font-size: 12px; opacity: .9; white-space: nowrap; }
.score .lead { font-size: 10px; background: var(--mustard); color: var(--ink); border-radius: 4px; padding: 1px 4px; font-weight: 800; }

/* ---------- main grid ---------- */
main.console { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; padding: 18px 20px 28px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1100px) { main.console { grid-template-columns: 1fr; } }
@media (max-width: 1100px) { header.bar { position: static; } } /* the wrapped header is too tall to pin on narrow screens */
.panel { background: var(--ink-2); border-radius: 18px; padding: 16px; border: 1px solid #fff1; }
.panel + .panel { margin-top: 18px; }
.panel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 24px; }
.panel-head .hint { font-size: 13px; opacity: .7; }
.tag-mission { color: var(--mustard); } .tag-orbit { color: var(--sky); } .tag-part { color: var(--salmon); } .tag-event { color: var(--orange); } .tag-fact { color: var(--lilac); }

/* turn banner */
.turnbar { display: flex; align-items: center; gap: 16px; background: var(--paper); color: var(--ink); border-radius: 18px; padding: 12px 16px; flex-wrap: wrap; }
.turnbar h2 { font-size: 26px; }
.pips { display: flex; gap: 6px; }
.pip { width: 18px; height: 18px; border-radius: 50%; background: var(--orange); box-shadow: inset 0 -3px 0 #0003; }
.pip.used { background: #0002; box-shadow: none; }
.turnbar .money { font-family: var(--mono); font-weight: 700; font-size: 18px; }
.turnbar .spacer { flex: 1; }

/* coach */
.coach { display: flex; align-items: center; gap: 12px; background: var(--teal); color: var(--ink); border-radius: 18px; padding: 10px 16px; margin-top: 18px; font-weight: 600; }
.coach .eyebrow { flex: none; }
.coach span.t { flex: 1; }
.coach-target { outline: 4px solid var(--teal) !important; outline-offset: 3px; animation: coachpulse 1s ease-in-out infinite alternate; }
@keyframes coachpulse { to { outline-offset: 7px; } }

/* missions */
.missions { display: flex; gap: 14px; flex-wrap: wrap; }
.cardimg { width: 150px; aspect-ratio: 630/880; border-radius: 10px; overflow: hidden; display: block; background: var(--ink-3); border: 0; padding: 0; position: relative; box-shadow: 0 6px 18px #0007; }
.cardimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cardimg.sel { outline: 4px solid var(--mustard); outline-offset: 3px; }
.cardimg .badge { position: absolute; left: 8px; top: 34px; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.mission-slot { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.mission-slot .cap { font-size: 12px; opacity: .8; max-width: 150px; }
.cardimg.empty { display: grid; place-items: center; text-align: center; background: transparent; border: 2px dashed #fff4; box-shadow: none; color: var(--paper); padding: 12px; }
.cardimg.empty b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 20px; color: var(--mustard); display: block; }

/* build bay */
.bay { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 16px; margin-top: 16px; }
.bay h3 { font-size: 22px; }
.bay .sub { font-size: 13px; opacity: .75; }
.orbits { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.orbit-btn { border: 2px solid var(--ink); background: transparent; border-radius: 12px; padding: 6px 10px; text-align: left; color: var(--ink); min-width: 104px; }
.orbit-btn .t { font-weight: 800; font-size: 13px; display: block; }
.orbit-btn .m { font-family: var(--mono); font-size: 11px; }
.orbit-btn.on { background: var(--sky); }
.orbit-btn:disabled { opacity: .3; cursor: not-allowed; }
.orbit-btn.on:disabled { opacity: 1; }
.bayrow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .bayrow { grid-template-columns: 1fr; } }
.chassis { background: var(--ink); border-radius: 12px; padding: 10px; }
.chassis-grid { display: grid; gap: 4px; }
.cell { height: 34px; border-radius: 6px; background: #ffffff10; border: 1px dashed #ffffff2a; }
.cell.fill { border: 0; display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 800; color: var(--ink); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chassis .nf { color: var(--paper); font-size: 13px; padding: 14px; text-align: center; opacity: .8; }
.chassis .ext { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chassis .ext span { font-size: 11px; font-weight: 800; color: var(--ink); background: var(--salmon); border-radius: 6px; padding: 4px 8px; }
.cat-instrument { background: var(--mustard); } .cat-power { background: #f3d36b; } .cat-comms { background: var(--sky); } .cat-control { background: var(--teal); } .cat-prop { background: var(--salmon); } .cat-rel { background: var(--lilac); }
.partlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.partlist li { display: flex; align-items: center; gap: 6px; background: var(--paper-2); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12px; font-weight: 600; }
.partlist button { border: 0; background: var(--ink); color: var(--paper); border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 20px; padding: 0; }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.meter { background: var(--paper-2); border-radius: 12px; padding: 8px 10px; }
.meter .k { font-size: 11px; font-weight: 800; text-transform: uppercase; }
.meter .v { font-family: var(--mono); font-weight: 700; font-size: 18px; }
.meter.warn .v { color: var(--bad); }
.tradespace { margin-top: 10px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 12px; }
.ts-row { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; }
.ts-row .track { height: 10px; background: #ffffff14; border-radius: 99px; overflow: hidden; }
.ts-row .fillb { height: 100%; border-radius: 99px; }
.ts-row .val { font-family: var(--mono); text-align: right; }
.review { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 13px; }
.review li { display: flex; gap: 8px; align-items: baseline; }
.review .ok { color: #2e7a63; font-weight: 800; } .review .no { color: var(--bad); font-weight: 800; }
.launchrow { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.launchrow .note { font-size: 12px; opacity: .8; }

/* shelf & market */
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.shelf-item { background: var(--salmon); color: var(--ink); border: 0; border-radius: 12px; padding: 8px; text-align: left; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto 1fr; column-gap: 8px; row-gap: 2px; min-height: 74px; }
.shelf-item img { grid-row: 1 / 3; width: 30px; border-radius: 4px; align-self: start; }
.shelf-item .t { font-weight: 800; font-size: 13px; line-height: 1.15; }
.shelf-item .m { font-family: var(--mono); font-size: 11px; margin-top: auto; }
.shelf-item:disabled { opacity: .45; cursor: not-allowed; }
.market { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.market .cardimg { width: 100%; }
.market .price { display: block; text-align: center; font-family: var(--mono); font-size: 12px; margin-top: 4px; }
.market .discount { color: var(--teal); font-weight: 700; }
.toolrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

/* tracker */
.tracker { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.sat { background: var(--ink-3); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start; border-left: 6px solid var(--who, var(--mustard)); }
.sat img { width: 54px; border-radius: 6px; }
.sat .t { font-weight: 800; font-size: 14px; }
.sat .o { font-size: 12px; opacity: .8; }
.dbar { height: 10px; background: #ffffff18; border-radius: 99px; overflow: hidden; margin-top: 6px; display: flex; }
.dbar .down { background: var(--mustard); animation: grow .6s ease-out; } .dbar .stored { background: #eab43b66; }
.sat .status { font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; padding: 1px 6px; border-radius: 4px; margin-top: 4px; }
.st-pending { background: var(--sky); color: var(--ink); } .st-active { background: var(--teal); color: var(--ink); }
.empty-note { opacity: .6; font-size: 13px; }

/* log */
.log { max-height: 240px; overflow: auto; font-size: 12px; display: grid; gap: 3px; }
.log div { opacity: .85; } .log b { color: var(--mustard); font-family: var(--mono); font-weight: 400; }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: #120d14d9; z-index: 20; display: grid; place-items: center; padding: 16px; overflow: auto; }
.modal { background: var(--paper); color: var(--ink); border-radius: 22px; width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px #000a; }
.modal .mhead { background: var(--ink); color: var(--paper); padding: 16px 22px 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 1; }
.modal .mhead h2 { font-size: 28px; }
.modal .mbody { padding: 20px 22px 22px; }
.modal .mfoot { padding: 0 22px 22px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.modal.narrow { width: min(520px, 100%); }
.pick-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.pick-row .cardimg { width: 210px; }
.zoom { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
@media (max-width: 680px) { .zoom { grid-template-columns: 1fr; } .zoom .cardimg { margin: 0 auto; } }
.zoom .cardimg { width: 300px; max-width: 100%; }
.science { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
.science .eyebrow { color: var(--lilac); }
.science p { margin: 6px 0 8px; font-style: italic; font-family: Georgia, serif; font-size: 16px; }
.lede { font-size: 16px; }
.effect { background: var(--paper-2); border-radius: 12px; padding: 10px 14px; margin-top: 12px; }

/* setup screen */
.title-screen { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; overflow-x: clip; } /* the card fan pokes past narrow screens */
.title-card { width: min(1120px, 100%); display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: center; }
@media (max-width: 860px) { .title-card { grid-template-columns: 1fr; } }
.title-card h1 { font-size: clamp(56px, 9vw, 104px); line-height: .9; color: var(--mustard); }
.title-card h1 span { display: block; color: var(--orange); }
.title-card .tagline { font-size: 18px; max-width: 46ch; margin-top: 14px; }
.fan { position: relative; height: 380px; }
.fan .cardimg { position: absolute; width: 190px; top: 30px; transition: transform .3s; transform: rotate(var(--r)) translateY(var(--y)); }
.fan button.cardimg:hover { transform: rotate(var(--r)) translateY(calc(var(--y) - 22px)) scale(1.05); z-index: 3; }
.setup [hidden] { display: none !important; } /* the option rows set display, which would beat the hidden attribute */
.setup { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 22px; margin-top: 22px; display: grid; gap: 18px; box-shadow: 0 18px 50px #0006; }
.setup label { font-size: 12px; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 4px; }
.setup input[type=text] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 2px solid #241d2733; background: #fff8ea; font: inherit; font-weight: 600; color: var(--ink); transition: border-color .15s; }
.setup input[type=text]:focus { border-color: var(--ink); outline: none; }
.sect h3 { font-family: var(--body); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; color: #8a5a3a; display: flex; gap: 8px; align-items: center; }
.sect h3 b { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 11px; letter-spacing: 0; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 16px; font-weight: 800; color: var(--ink); transition: background .15s, color .15s; }
.seg button:hover:not(.on) { background: #241d2714; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg.small button { padding: 5px 12px; font-size: 13px; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.namefield { position: relative; }
.namefield .mark { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
.namefield input[type=text] { padding-left: 34px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.setup label.mode { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; border: 2px solid #241d2726; border-radius: 16px; padding: 12px 14px; margin: 0; cursor: pointer; background: #fff8ea; text-transform: none; font-size: 13px; font-weight: 400; transition: border-color .15s, transform .15s, background .15s; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode b { display: block; font-size: 16px; font-weight: 800; }
.mode svg { width: 44px; height: 44px; }
.mode:hover { transform: translateY(-2px); }
.mode:has(input:checked) { border-color: var(--ink); background: #fbe2a4; box-shadow: 0 4px 0 var(--ink); }
.mode:has(input:focus-visible) { outline: 3px solid var(--orange); outline-offset: 2px; }
.mode:has(input:disabled) { opacity: .45; cursor: not-allowed; transform: none; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.setup .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #fff8ea; border-radius: 12px; padding: 9px 12px; margin: 0; text-transform: none; font-size: 14px; font-weight: 400; cursor: pointer; }
.opt.static { cursor: default; }
.opt .what b { display: block; font-size: 14px; font-weight: 800; }
.opt .what span { font-size: 12px; opacity: .7; }
.switch { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 999px; background: #241d2733; position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
.switch:checked { background: var(--teal); }
.switch:checked::after { transform: translateX(18px); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; text-transform: none !important; }
@media (max-width: 560px) { .modes, .opts, .names { grid-template-columns: 1fr; } .setup { padding: 16px; } #seg .lg { display: none; } }
#seg button { white-space: nowrap; }

/* ops + debrief */
.opsline { border-left: 6px solid var(--who); background: var(--paper-2); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.opsline .t { font-weight: 800; }
.opsline ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
.die { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--paper); font-family: var(--mono); font-weight: 700; margin-right: 6px; }
.alts { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
.alts th, .alts td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #241d2722; vertical-align: top; }
.alts td.n { white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.alts tr.you td { font-weight: 800; }
.outcome { display: inline-block; font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.outcome.done { background: var(--teal); } .outcome.lost, .outcome.reentered { background: var(--bad); color: var(--paper); }
.altdot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 800; margin-right: 6px; border: 1.5px solid var(--ink); vertical-align: -4px; }
.chartwrap svg { width: 100%; height: auto; display: block; }


/* ---------- motion ---------- */
@keyframes dealIn { from { opacity: 0; transform: translate(var(--dx, 140px), var(--dy, -70px)) rotate(var(--dr, 16deg)) scale(.7); } }
.deal { animation: dealIn .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 110ms); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } }
.pop { animation: pop .35s ease-out both; }
@keyframes grow { from { width: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
.late { animation: fadeIn .4s 1.6s both; }
@keyframes spin { to { transform: rotate(360deg); } }
.cardimg { transition: transform .15s; }
button.cardimg:not(.empty):hover { transform: translateY(-4px) rotate(-1deg); }

/* card back + shuffle and flip (event draw, forecast) */
.cardback { background: var(--ink) repeating-linear-gradient(135deg, #ffffff0d 0 10px, transparent 10px 20px); border: 6px solid var(--paper); border-radius: 12px; display: grid; place-items: center; box-shadow: 0 6px 18px #0007; }
.deckflip { position: relative; width: 300px; max-width: 100%; aspect-ratio: 630/880; perspective: 900px; margin: 0 auto; }
.deckflip > .cardback, .deckflip .flipper, .deckflip .flipper > * { position: absolute; inset: 0; }
.deckflip .shuf { animation: shuf .9s ease-in-out both; }
.deckflip .shuf:nth-child(1) { --sx: -46px; --sr: -9deg; }
.deckflip .shuf:nth-child(2) { --sx: 46px; --sr: 9deg; animation-delay: .08s; }
.deckflip .shuf:nth-child(3) { --sx: -24px; --sr: -4deg; animation-delay: .16s; }
@keyframes shuf { 0%, 100% { transform: none; } 30% { transform: translateX(var(--sx)) rotate(var(--sr)); } 65% { transform: translateX(calc(var(--sx) * -.6)) rotate(calc(var(--sr) * -.6)); } }
.deckflip .flipper { transform-style: preserve-3d; animation: flip .7s 1.05s cubic-bezier(.3,.7,.3,1) both; }
@keyframes flip { from { transform: rotateY(180deg); } }
.deckflip .flipper > * { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.deckflip .flipper .cardback { transform: rotateY(180deg); }
.zoom .deckflip .cardimg { width: 100%; }

/* launch */
.rocket { position: fixed; left: 50%; bottom: -110px; z-index: 40; pointer-events: none; transform: translateX(-50%); animation: liftoff 1.3s cubic-bezier(.5,0,.8,.4) forwards; }
@keyframes liftoff { to { transform: translate(-50%, -125vh); } }
.rocket .flame { transform-origin: 20px 44px; animation: flick .09s infinite alternate; }
@keyframes flick { to { transform: scaleY(1.5); } }

/* card library */
.gal { display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; margin-top: 14px; }
.galnav { width: 44px; height: 44px; padding: 0; font-size: 26px; line-height: 1; }
.gal h3 { font-size: 26px; }
.gal .count { font-family: var(--mono); font-size: 12px; opacity: .7; }
.strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 14px 4px 6px; }
.strip .cardimg { width: 64px; flex: none; scroll-snap-align: center; opacity: .6; box-shadow: none; }
.strip .cardimg.sel { opacity: 1; outline-width: 3px; }
@keyframes slideL { from { opacity: 0; transform: translateX(70px) rotate(5deg); } }
@keyframes slideR { from { opacity: 0; transform: translateX(-70px) rotate(-5deg); } }
.slide-next { animation: slideL .3s ease-out both; } .slide-prev { animation: slideR .3s ease-out both; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chips span { background: var(--sky); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; font-family: var(--mono); }


/* orbit map */
.orbitrow { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .orbitrow { grid-template-columns: 1fr; } }
.omap svg { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
.ring { fill: none; stroke: #ffffff33; stroke-width: 1.5; stroke-dasharray: 3 5; }
.ring.on { stroke: var(--mustard); stroke-width: 2.5; stroke-dasharray: none; }
.rl { fill: var(--paper); font-size: 10px; font-family: var(--mono); opacity: .75; paint-order: stroke; stroke: var(--ink-2); stroke-width: 3px; }
.rl.on { fill: var(--mustard); opacity: 1; font-weight: 700; }
.osat { animation: spin linear infinite; }
.olegs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.oleg { border: 0; background: var(--ink-3); color: var(--paper); border-radius: 999px; padding: 3px 9px; font-size: 11px; font-family: var(--mono); }
.oleg b { color: var(--sky); }
.oleg.on { outline: 2px solid var(--mustard); }

/* operations report */
.opsviz { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.opsviz .dbar { flex: 1; min-width: 120px; margin-top: 0; height: 14px; background: #241d2722; }
.opsviz .dbar .stored { background: #eab43b88; }
.opsviz .die { margin-right: 0; }
.opsviz .vs { font-size: 12px; }
.die.rolling { background: var(--orange); color: var(--ink); }
.stamp { font-weight: 800; font-size: 12px; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; border: 2px solid; transform: rotate(-4deg); }
.stamp.ok { color: #2e7a63; } .stamp.bad { color: var(--bad); }
.opsline details { margin-top: 6px; font-size: 13px; }
.opsline summary { cursor: pointer; font-weight: 700; opacity: .75; }

/* plain-language labels */
.key { font-size: 12px; margin: 8px 0 0; opacity: .85; }
.meter .k span { display: block; font-weight: 400; text-transform: none; opacity: .7; }

/* players: a shape as well as a colour */
.mark { font-size: 15px; line-height: 1; display: inline-block; width: 1em; text-align: center; }
.turnbar .mark { font-size: 22px; }

/* co-op roles */
.roles { flex: 1; min-width: 240px; }
.roles ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.roles li { background: var(--ink-3); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.roles li.mine { outline: 2px solid var(--mustard); }
.roles li span { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }

/* warnings, insurance, trade */
.warn { background: #e2603a22; border-left: 4px solid var(--bad); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 8px 0 0; }
.insure { font-size: 13px; text-transform: none; margin-top: 8px; }
.insure small { display: block; font-weight: 400; opacity: .75; }
.tradeform { display: grid; gap: 10px; }
.tradeform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tradeform input[type=number] { width: 100%; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--ink); background: #fff8ea; font: inherit; }

/* toasts */
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 10px; z-index: 30; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 30px #0009; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; font-size: 13px; }
.toast.err { background: var(--orange); }
.toast img { width: 52px; border-radius: 6px; }
.toast button { border: 0; background: transparent; font-size: 18px; line-height: 1; color: var(--ink); }
.toast .eyebrow { color: #7a4f8a; font-size: 11px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="swoosh" viewBox="0 0 240 40">
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M2 34 H96 C120 34 122 8 146 8 H238" stroke="#e2793a"/>
      <path d="M2 28 H92 C114 28 116 2 140 2 H238" stroke="#eab43b" transform="translate(0,0)"/>
      <path d="M2 40 H100 C126 40 128 14 152 14 H238" stroke="#fff1d8" transform="translate(0,-2)"/>
      <path d="M2 40 H104 C132 40 134 20 158 20 H238" stroke="#9db3cf" transform="translate(0,2)"/>
    </g>
  </symbol>
</svg>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script src="engine.js"></script>
<script>
'use strict';
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PLAYER_COLORS = ['#eab43b', '#9db3cf', '#f2ab95', '#7fb8a6'];
const DEFAULT_NAMES = ['Orion Works', 'Vega Labs', 'Lyra Agency', 'Polaris Co.'];
const SUN_LABEL = { low: 'Low', medium: 'Medium', high: 'High', veryhigh: 'Very high' };
const COMMS_LABEL = { fast: 'Fast', slow: 'Slow', veryslow: 'Very slow' };
const CAT = { thermal: 'instrument', multispectral: 'instrument', radiation: 'instrument', telescope: 'instrument', magnetometer: 'instrument', sail: 'instrument',
  cells: 'power', panels: 'power', battery: 'power', uhf: 'comms', sband: 'comms', hga: 'comms', wheels: 'control', magnetorquers: 'control',
  coldgas: 'prop', electric: 'prop', shielding: 'rel', computer: 'rel' };
const ALT_COLORS = ['#e2793a', '#9db3cf', '#7fb8a6'];
const SAVE_KEY = 'sakipa-satellite-save-v3';
let CARDS = [], G = null, UI = { setupPlayers: 2, setupNames: [], setupMode: 'race', setupWin: 10, setupFund: 5, setupGuide: true, setupAdv: false, debriefShown: 0, seenFacts: {} };

// ---------- starfield ----------
function drawStars() {
  const c = $('#stars'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const g = x.createRadialGradient(innerWidth * .8, -100, 50, innerWidth * .8, -100, innerWidth);
  g.addColorStop(0, '#3a2a3a'); g.addColorStop(1, '#241d27');
  x.fillStyle = g; x.fillRect(0, 0, innerWidth, innerHeight);
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < Math.min(420, innerWidth * innerHeight / 3500); i++) {
    const s = r() < .93 ? r() * 1.1 + .3 : r() * 1.8 + 1;
    x.fillStyle = r() < .15 ? '#eab43b' : r() < .3 ? '#9db3cf' : '#fff1d8';
    x.globalAlpha = .25 + r() * .6;
    x.beginPath(); x.arc(r() * innerWidth, r() * innerHeight, s, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;
}
addEventListener('resize', () => { clearTimeout(drawStars.t); drawStars.t = setTimeout(drawStars, 150); });

// ---------- helpers ----------
const C = id => LW.card(id);
const img = id => C(id).image;
function cardImg(id, opts = {}) {
  const c = C(id);
  return `<button class="cardimg ${opts.cls || ''}" data-zoom="${esc(id)}" ${opts.attrs || ''} aria-label="${esc(c.type + ': ' + c.title)}"><img src="${esc(c.image)}" alt="" loading="lazy">${opts.badge ? `<span class="badge">${esc(opts.badge)}</span>` : ''}</button>`;
}
function swoosh(w = 120) { return `<svg class="swoosh" style="width:${w}px" aria-hidden="true"><use href="#swoosh"/></svg>`; }
function curIdx() { const i = LW.current(G); return i == null ? G.lead : i; }
function me() { return G.players[curIdx()]; }
function bld(i = curIdx()) { return LW.buildOf(G, i); }
const SHAPES = ['●', '■', '▲', '◆'];
function mark(i) { return `<span class="mark" style="color:${PLAYER_COLORS[i]}" aria-hidden="true">${SHAPES[i]}</span>`; }
function shapeSvg(i, x, y, fill, stroke) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="3"`;
  if (i === 1) return `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" ${a}/>`;
  if (i === 2) return `<path d="M${x} ${y - 8}L${x + 7} ${y + 5}H${x - 7}Z" ${a}/>`;
  if (i === 3) return `<path d="M${x} ${y - 8}L${x + 7} ${y}L${x} ${y + 8}L${x - 7} ${y}Z" ${a}/>`;
  return `<circle cx="${x}" cy="${y}" r="6" ${a}/>`;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ G, UI: { debriefShown: UI.debriefShown, seenFacts: UI.seenFacts, step: UI.step } })); } catch (e) {} }
function loadSave() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function toast(html, cls = '', ms = 5000) {
  const t = document.createElement('div'); t.className = 'toast ' + cls;
  t.innerHTML = html + '<button aria-label="Dismiss">×</button>';
  t.lastChild.onclick = () => t.remove();
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}
function errorToast(msg) { toast(`<span></span><div><b>Can't do that.</b><br>${esc(msg)}</div>`, 'err', 4500); }
function factFor(cardId) {
  const c = C(cardId); if (!c.science) return null;
  return LW.byType('fact').find(f => f.science === c.science) || null;
}
function factToast(cardId) {
  const f = factFor(cardId), c = C(cardId);
  if (!c.science || UI.seenFacts[c.science]) return;
  UI.seenFacts[c.science] = 1;
  toast(`${f ? `<img src="${esc(f.image)}" alt="">` : '<span></span>'}<div><div class="eyebrow">Real science${f ? ' · ' + esc(f.title) : ''}</div>${esc(c.science)} <a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">Source</a></div>`, '', 9000);
}

// ---------- modal ----------
function modal({ title, tag, body, foot, narrow, onClose, dismiss = true }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal ${narrow ? 'narrow' : ''}">
    <div class="mhead">${tag ? `<span class="eyebrow ${tag[1]}">${esc(tag[0])}</span>` : ''}<h2 class="display">${esc(title)}</h2><span style="flex:1"></span>${swoosh(90)}</div>
    <div class="mbody">${body}</div>${foot ? `<div class="mfoot">${foot}</div>` : ''}</div></div>`;
  const scrim = root.firstChild;
  const close = () => { root.innerHTML = ''; onClose && onClose(); };
  UI.modalClose = dismiss ? close : null;
  if (dismiss) scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
  const f = scrim.querySelector('.mfoot .btn, .mbody button, .mbody input'); if (f) setTimeout(() => f.focus(), 30);
  return { el: scrim, close: () => { root.innerHTML = ''; } };
}
function closeModal() { $('#modal-root').innerHTML = ''; }
// Keyboard: Tab stays inside an open dialog, Escape closes it when it can be dismissed.
document.addEventListener('keydown', e => {
  const scrim = $('#modal-root .scrim'); if (!scrim) return;
  if (e.key === 'Escape' && UI.modalClose) { e.preventDefault(); UI.modalClose(); return; }
  if (e.key !== 'Tab') return;
  const f = [...scrim.querySelectorAll('button:not(:disabled), a[href], input:not(:disabled), select:not(:disabled), [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], at = document.activeElement;
  if (!scrim.contains(at)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && at === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && at === last) { e.preventDefault(); first.focus(); }
});


// Real distances and signal delays, shown on orbit cards and the orbit map.
const ORBIT_REAL = {
  leo: ['160–2,000 km up', 'the ISS flies at about 400 km'],
  sso: ['about 600–800 km up', 'passes near both poles'],
  geo: ['35,786 km up', 'one orbit takes 24 hours'],
  lunar: ['about 384,400 km away', 'a radio signal takes 1.3 s'],
  l2: ['about 1.5 million km away', 'a radio signal takes 5 s'],
  mars: ['55–400 million km away', 'a radio signal takes 3–22 min']
};
function cardDetails(c) {
  let extra = '';
  if (c.type === 'event') extra = `<div class="effect"><b>In play:</b> ${esc(eventHelp(c.id))}</div>`;
  if (c.type === 'orbit') extra = `<div class="chips">${ORBIT_REAL[c.rules.code].map(t => `<span>${esc(t)}</span>`).join('')}</div><div class="effect">${esc(LW.ORBIT_LESSONS[c.rules.code])}</div>`;
  if (c.type === 'part' && CAT[c.rules.key]) extra = `<div class="effect">${esc(partHelp(c.rules.key))}</div>`;
  if (c.type === 'mission') extra = `<div class="effect">${esc(missionCostHint(c.id))}</div>`;
  return `${c.type === 'fact' ? '' : `<p class="lede">${esc(c.text)}</p>`}${extra}
      ${c.science ? `<div class="science"><div class="eyebrow">Real science</div><p>${esc(c.science)}</p><a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">Read the source ↗</a></div>` : ''}`;
}
// ---------- card library: flip through every card ----------
function showGallery(type = 'mission') {
  const TYPES = [['mission', 'Missions'], ['orbit', 'Orbits'], ['part', 'Parts'], ['event', 'Events'], ['fact', 'Field notes']];
  let idx = 0;
  const list = () => { const seen = new Set(); return LW.byType(type).filter(c => !seen.has(c.title) && seen.add(c.title)); }; // copies of a part show once
  const m = modal({ title: 'Card library', tag: [CARDS.length + ' cards', 'tag-fact'],
    body: `<div class="seg" id="gtabs">${TYPES.map(([t, l]) => `<button data-t="${t}">${l}</button>`).join('')}</div><div id="gbody"></div>`,
    foot: `<span style="margin-right:auto;font-size:13px;opacity:.7">Use ← → to flip through</span><button class="btn go" id="gclose">Close</button>` });
  const draw = dir => {
    const cs = list(), c = cs[idx];
    [...$('#gtabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === type));
    $('#gbody').innerHTML = `<div class="gal"><button class="btn galnav" id="gprev" aria-label="Previous card">‹</button>
      <div class="zoom"><div class="cardimg slide-${dir}"><img src="${esc(c.image)}" alt=""></div><div><h3 class="display">${esc(c.title)}</h3><span class="count">${idx + 1} / ${cs.length}</span>${cardDetails(c)}</div></div>
      <button class="btn galnav" id="gnext" aria-label="Next card">›</button></div>
      <div class="strip" id="gstrip">${cs.map((x, i) => `<button class="cardimg ${i === idx ? 'sel' : ''}" data-i="${i}" aria-label="${esc(x.title)}"><img src="${esc(x.image)}" alt="" loading="lazy"></button>`).join('')}</div>`;
    const sel = $('#gstrip .sel'); if (sel) $('#gstrip').scrollLeft = sel.offsetLeft - $('#gstrip').clientWidth / 2;
  };
  const go = d => { const n = list().length; idx = (idx + d + n) % n; draw(d < 0 ? 'prev' : 'next'); };
  m.el.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.t) { type = t.dataset.t; idx = 0; draw('next'); }
    else if (t.id === 'gprev') go(-1); else if (t.id === 'gnext') go(1);
    else if (t.dataset.i != null) { const d = +t.dataset.i < idx ? 'prev' : 'next'; idx = +t.dataset.i; draw(d); }
    else if (t.id === 'gclose') closeModal();
  });
  m.el.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
  draw('next');
}

// ---------- card zoom ----------
function zoom(id) {
  const c = C(id);
  const tags = { mission: ['Mission', 'tag-mission'], orbit: ['Orbit', 'tag-orbit'], part: ['Part', 'tag-part'], event: ['Event', 'tag-event'], fact: ['Field note', 'tag-fact'] };
  let foot = '';
  const slot = G && G.phase === 'turns' ? G.market.indexOf(id) : -1;
  if (slot >= 0 && !G.pending) foot = `<button class="btn go" id="zbuy">Buy for ${LW.partPrice(G, c.rules.key)} BC</button>`;
  const m = modal({ title: c.title, tag: tags[c.type], narrow: false,
    body: `<div class="zoom">${cardImg(id)}<div>${cardDetails(c)}</div></div>`,
    foot: foot + `<button class="btn ghost" style="color:var(--ink);box-shadow:inset 0 0 0 2px #241d2733" id="zclose">Close</button>` });
  $('#zclose').onclick = closeModal;
  if ($('#zbuy')) $('#zbuy').onclick = () => { closeModal(); doAct({ type: 'buy', source: 'market', slot }); };
}
function partHelp(k) {
  return ({ wheels: 'Fine pointing: collects 2 Data per round instead of 1. Counts as attitude control (−1 Risk compared with none).',
    magnetorquers: 'Cheap attitude control that pushes against Earth’s magnetic field, so it only works in LEO or SSO.',
    battery: 'Stores power for the dark side of the orbit. A satellite without one is riskier (+1 Risk) and suffers in Eclipse Passage.',
    shielding: 'Lowers Risk by 1 and protects against Solar Flares and Thermal Stress.', computer: 'A backup flight computer. Lowers Risk by 1.',
    coldgas: 'A small thruster for dodging debris: protects against Space Debris Warning.', electric: 'Efficient propulsion needed to reach lunar orbit, L2 or Mars.',
    uhf: 'Cheapest radio. Sends at most 2 Data per ground pass.', sband: 'Standard radio. Sends all stored Data each pass.',
    hga: 'Points a tight beam home. Sends everything, every round, even from the Moon. Required at L2 and Mars.',
    cells: 'Small solar cells on the body: +3 W (more in strong sunlight). They take no volume, but the frame surface is limited: 1U fits 1, 3U 2, 6U 3, 12U 4.', panels: 'Unfolding solar wings: +6 W (more in strong sunlight).'
  })[k] || 'Meets the matching mission’s instrument requirement.';
}
function eventHelp(id) {
  return ({ 'event-01': 'In Operations, unshielded satellites at GEO, the Moon or L2 roll a d10; on 1–3 they skip this round.',
    'event-02': 'In Operations, LEO satellites without any thruster skip this round. Their 3-round lifetime still counts down.',
    'event-03': 'Nobody can launch this round.', 'event-04': 'Already applied: every agency lost 3 BC before funding.',
    'event-05': 'Launch prices are halved this round.', 'event-06': 'Already applied: the agency with the fewest SP got 5 BC.',
    'event-07': 'The Mission Lead picked a Market part that now costs 1 BC less for the rest of the game.',
    'event-08': 'In Operations, every working satellite downlinks all its stored Data through a big ground dish: off-schedule passes allowed, and UHF has no 2-Data limit.', 'event-09': 'Launches to LEO or SSO cost 1 BC more this round.',
    'event-10': 'Satellites with deployable panels collect 1 extra Data this round.', 'event-11': 'Satellites without a battery collect 1 less Data this round.',
    'event-12': 'Only high-gain antennas can downlink this round. Data is kept.', 'event-13': 'Unshielded satellites launching this round get +1 Risk.',
    'event-14': 'Redundant computers cost 1 BC less this round.', 'event-15': 'Satellites without wheels or magnetorquers collect nothing this round.',
    'event-16': 'S-band radios can’t downlink this round. Data is kept.', 'event-17': 'Each agency gets one free Trade Study this round (it still uses an action).',
    'event-18': 'Satellites with only body-mounted cells collect 1 less Data.', 'event-19': 'Every launch costs 1 BC less this round.',
    'event-20': 'In Operations, every working satellite can downlink with its own antenna, even off-schedule. UHF still sends at most 2 Data.' })[id] || C(id).text;
}

// ---------- title / setup ----------
function renderTitle() {
  const saved = loadSave();
  const fanIds = ['mission-05', 'orbit-04', 'part-31', 'event-01', 'fact-01'];
  $('#app').innerHTML = `<div class="title-screen"><div class="title-card">

// ---------- flow ----------
function nextRound() {
  LW.startRound(G); UI.step = 'event'; save(); renderGame(); showEvent();
}
function resumeFlow() {
  renderGame();
  if (G.phase === 'event') showEvent();
  else if (G.phase === 'turns') beforeTurn(true);
  else if (G.phase === 'ops') afterTurns();
  else if (G.phase === 'roundEnd') showDebriefs(() => { LW.endRound(G); nextRound(); });
  else if (G.phase === 'over') showDebriefs(showGameOver);
}
function deckFlip(id) {
  const back = '<div class="cardback shuf"></div>';
  return `<div class="deckflip">${back}${back}${back}<div class="flipper">${cardImg(id)}<div class="cardback">${swoosh(120)}</div></div></div>`;
}
function launchFx() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const d = document.createElement('div'); d.className = 'rocket';
  d.innerHTML = '<svg viewBox="0 0 40 90" width="60" aria-hidden="true"><path class="flame" d="M13 44h14l-7 28z" fill="#eab43b"/><path d="M20 2c9 10 12 26 12 42H8C8 28 11 12 20 2z" fill="#fff1d8" stroke="#241d27" stroke-width="2"/><circle cx="20" cy="24" r="5" fill="#9db3cf" stroke="#241d27" stroke-width="2"/><path d="M8 40l-7 14h9zM32 40l7 14h-9z" fill="#e2793a" stroke="#241d27" stroke-width="2"/></svg>';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1500);
}
function showEvent() {
  const ev = C(G.event), lead = G.players[G.lead];

  modal({ title: ev.title, tag: ['Round ' + G.round + ' event', 'tag-event'], dismiss: false,
    body: `<div class="zoom">${deckFlip(G.event)}<div>
      <p class="lede">${esc(lead.name)} is Mission Lead and draws the event.</p><div class="late">
      <div class="effect"><b>Effect:</b> ${esc(eventHelp(G.event))}</div>
      <p>${G.coop ? `The team receives <b>+${LW.COOP_FUNDING} BC</b> of funding, split between agencies.` : `Every agency receives <b>+${G.funding} BC</b> of yearly funding.`}</p>
      ${G.round === 1 ? `<p><b>Round 1:</b> every agency gets ${LW.actionsFor(G)} actions instead of ${LW.ACTIONS_PER_TURN}, enough to launch a first satellite straight away.</p>` : ''}
      ${tech ? `<p><b>${esc(lead.name)}, pick a Market part to make cheaper for the rest of the game:</b></p><div class="pick-row" id="techpick" style="justify-content:flex-start">${G.market.filter(Boolean).map(id => `<button class="btn small" data-k="${esc(C(id).rules.key)}">${esc(C(id).title)}</button>`).join('')}</div>` : ''}
    </div></div></div>`,
    foot: tech ? '' : `<button class="btn go" id="evgo">Begin turns</button>` });
  $('.mhead h2').classList.add('late');
  const begin = () => { closeModal(); LW.beginTurns(G); save(); beforeTurn(); };
  if (tech) $('#techpick').onclick = e => { const b = e.target.closest('button'); if (!b) return; LW.act(G, { type: 'techPick', key: b.dataset.k }); begin(); };
  else $('#evgo').onclick = begin;
}
function beforeTurn(resumed) {
  renderGame();
  const p = me();
  const reveal = () => { closeModal(); renderGame(); if (G.pending && G.pending.type === 'draft') showDraft(); else if (G.pending && G.pending.type === 'trade') showTrade(); };
  if (G.players.length > 1 || resumed) {
    $('#app').classList.add('veiled');
    modal({ title: p.name + ', your turn', tag: ['Round ' + G.round + ' of ' + LW.ROUNDS, 'tag-mission'], narrow: true, dismiss: false,
      body: `<p class="lede">${G.players.length > 1 ? 'Pass the device to <b>' + esc(p.name) + '</b>. Other agencies, look away from the missions.' : 'Welcome back to mission control.'}</p>
        <p>You have <b>${LW.actionsFor(G)} actions</b> and <b>${p.bc} BC</b>.${G.coop ? ' Your subsystems: <b>' + p.roles.map(r => LW.ROLES[r].name).join(', ') + '</b>.' : ''}</p>`,
      foot: `<button class="btn go" id="ready">I'm ready</button>` });
    $('#ready').onclick = () => { $('#app').classList.remove('veiled'); reveal(); };
  } else reveal();
}
function doAct(a) {
  const res = LW.act(G, a);
  if (!res.ok) { errorToast(res.error); return res; }
  if (res.cardId) factToast(res.cardId);
  save(); renderGame();
  if (G.pending && G.pending.type === 'draft') showDraft();
  if (G.pending && G.pending.type === 'trade') showTrade();
  if (res.eventId) showPeek(res.eventId);
  if (res.sat) { launchFx(); const s = G.sats.find(x => x.id === res.sat); factToast(LW.orbitCard(s.orbit).id); }
  return res;
}
function endTurn() {
  if (G.pending) return errorToast('Finish the current choice first.');
  const res = LW.act(G, { type: 'endTurn' });
  save();
  if (res.ops) afterTurns(); else beforeTurn();
}
function afterTurns() {
  const rep = LW.runOps(G); save(); renderGame();
  showOps(rep, () => showDebriefs(() => {
    if (G.phase === 'over') { save(); showGameOver(); }
    else { LW.endRound(G); nextRound(); }
  }));
}

      <div class="shelf" id="so">${list.map(k => { const pc = LW.partCard(k); return `<button class="shelf-item" data-k="${k}" ${LW.canBuy(G, curIdx(), k) ? '' : 'disabled'}><img src="${esc(pc.image)}" alt="" loading="lazy"><span class="t">${esc(pc.title)}</span><span class="m">${LW.partPrice(G, k) + LW.SPECIAL_ORDER_FEE} BC · ${pc.rules.volume} U · ${pc.rules.power > 0 ? '+' : ''}${pc.rules.power} W · ${keys[k]} left</span></button>`; }).join('') || '<p>The deck is empty.</p>'}</div>` });

function showOps(rep, next) {

    const p = G.players[l.owner], sat = G.sats.find(x => x.id === l.sat), need = C(sat.missionId).rules.data;

    const pct = v => Math.min(100, v / need * 100);

    return `<div class="opsline deal" style="--who:${PLAYER_COLORS[l.owner]};--i:${i * 3};--dx:0px;--dy:30px;--dr:0deg">

        ${lost ? '' : `<div class="dbar"><span class="down" style="width:${pct(sat.down)}%"></span><span class="stored" style="width:${Math.min(100 - pct(sat.down), pct(sat.stored))}%"></span></div><span class="mono">${sat.down}/${need} Data home</span>`}

function altDiff(you, a) {
  const count = arr => arr.reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
  const cy = count(you.parts), ca = count(a.parts), add = [], drop = [];
  Object.keys(ca).forEach(k => { if ((ca[k] || 0) > (cy[k] || 0)) add.push(LW.partCard(k).title); });
  Object.keys(cy).forEach(k => { if ((cy[k] || 0) > (ca[k] || 0)) drop.push(LW.partCard(k).title); });
  const bits = [];
  if (add.length) bits.push('Adds ' + add.join(', '));
  if (drop.length) bits.push('drops ' + drop.join(', '));
  let t = bits.length ? bits.join('; ') + '.' : 'Same parts as yours.';
  const dc = a.cost - you.cost, dp = Math.round((a.chance - you.chance) * 100), dr = a.rounds - you.rounds;
  const eff = [];
  if (dc) eff.push((dc > 0 ? dc + ' BC more' : -dc + ' BC less'));
  if (dp) eff.push((dp > 0 ? '+' : '') + dp + ' points launch chance');
  if (dr) eff.push(dr > 0 ? dr + ' round' + (dr > 1 ? 's' : '') + ' slower' : -dr + ' round' + (dr < -1 ? 's' : '') + ' faster');
  return t.charAt(0).toUpperCase() + t.slice(1) + (eff.length ? ' ' + eff.join(', ') + '.' : '');
}
function tradeChart(alts) {
  const W = 620, H = 250, L = 56, R = 20, T = 18, B = 44;
  const maxC = Math.max(10, ...alts.map(a => a.cost)) * 1.15;
  const x = c => L + (c / maxC) * (W - L - R), y = ch => T + (1 - ch) * (H - T - B);
  let g = '';
  for (let p = 0; p <= 100; p += 25) g += `<line x1="${L}" x2="${W - R}" y1="${y(p / 100)}" y2="${y(p / 100)}" stroke="#241d27" stroke-opacity=".12"/><text x="${L - 8}" y="${y(p / 100) + 4}" text-anchor="end" font-size="11" fill="#241d27">${p}%</text>`;
  const step = maxC > 40 ? 10 : 5;
  for (let c = 0; c <= maxC; c += step) g += `<text x="${x(c)}" y="${H - B + 18}" text-anchor="middle" font-size="11" fill="#241d27">${c}</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="#241d27">Total cost (BC, parts + launch)</text>`;
  g += `<text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700" fill="#241d27">Launch success chance</text>`;
  const order = alts.map((a, i) => i).sort((a, b) => (alts[b].rounds) - (alts[a].rounds));
  order.forEach(i => {
    const a = alts[i], r = 10 + Math.max(0, 5 - Math.min(a.rounds, 5)) * 3;
    const cx = x(a.cost), cy = y(a.chance);
    g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${ALT_COLORS[i]}" fill-opacity=".9" stroke="#241d27" stroke-width="${i === 0 ? 3 : 1.5}"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="#241d27">${i + 1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trade space: cost against launch success chance; bigger dots finish faster">${g}</svg><p style="font-size:12px;margin:2px 0 0;text-align:right">Numbers match the table. Bigger dot = finishes in fewer rounds.</p>`;
}

// ---------- coach: guided first satellite ----------
// ponytail: no tutorial script. The next step is derived from the same state the Design Review reads,
// so it can't drift from the rules. Shown to each agency until its first launch.
function coachStep(p) {
  const pi = curIdx(), b = bld(pi);
  if (!G.guide || G.phase !== 'turns' || G.pending) return null;
  if (G.coop ? !b : p.stats.launched > 0) return null;
  const fund = LW.fundingOf(G, pi);
  const end = why => ({ text: why + ' End your turn: installed parts stay, and you get +' + fund + ' BC next round.', sel: '#endturn' });
  if (!b) return p.missions.length < LW.MAX_MISSIONS && G.actionsLeft > 0 ? { text: 'Take a mission: it tells you which orbit and instrument you need.', sel: '#takemission' } : end('Nothing to build right now.');
  const m = C(b.missionId), o = LW.orbitCard(b.orbit), st = LW.designStats(b.parts, b.orbit), has = k => b.parts.some(x => x.key === k);
  if (G.actionsLeft < 1) return end('No actions left.');
  // buying step: from the shelf, the Market, or by Special Order
  const buy = (k, why) => {
    const pc = LW.partCard(k), shelf = LW.shelfKeys().includes(k), slot = G.market.findIndex(id => id && C(id).rules.key === k);
    const price = LW.partPrice(G, k) + (shelf || slot >= 0 ? 0 : LW.SPECIAL_ORDER_FEE);
    if (p.bc < price) return end(pc.title + ' costs ' + price + ' BC and you have ' + p.bc + '.' + (G.coop ? ' A teammate can send you BC with Trade.' : ''));
    if (shelf) return { text: why + ' Buy ' + pc.title + ' from the Workshop shelf (' + price + ' BC).', sel: `[data-shelf="${k}"]` };
    if (slot >= 0) return { text: why + ' ' + pc.title + ' is in the Market: buy it (' + price + ' BC).', sel: `[data-buy="${slot}"]` };
    return { text: why + ' ' + pc.title + ' is not in the Market. Use Special order (' + price + ' BC).', sel: '#sobtn' };
  };
  const classA = m.id === LW.COOP_MISSION;
  const ant = o.rules.requires.includes('hga') ? 'hga' : 'uhf';
  const essentials = [m.rules.payload, ant, ...o.rules.requires.filter(k => k !== 'hga'), ...(classA ? ['battery', 'wheels', 'shielding'] : [])];
  // what the design still needs, in build order
  const needs = [];
  if (!st.frame) {
    const vol = essentials.reduce((a, k) => a + LW.partCard(k).rules.volume, 0), f = vol <= 1 ? 'frame1' : vol <= 3 ? 'frame3' : vol <= 6 ? 'frame6' : 'frame12';
    needs.push([f, 'Start with a frame. The essentials for this mission need ' + vol + ' U; pick a bigger frame if you want room for backups.']);
  } else {
    if (!has(m.rules.payload)) needs.push([m.rules.payload, 'Now the instrument the mission asks for.']);
    if (!LW.bestAntenna(b.parts) || (ant === 'hga' && !has('hga'))) needs.push([ant, ant === 'hga' ? 'This orbit is too far for a small radio.' : 'Data only scores once it reaches Earth, so you need an antenna.']);
    o.rules.requires.filter(k => !has(k)).forEach(k => needs.push([k, o.title + ' needs this to get there.']));
    if (classA) {
      if (!has('battery')) needs.push(['battery', 'Flagships are Class A missions with backups for everything: add a battery.']);
      if (!has('wheels') && !has('magnetorquers')) needs.push(['wheels', 'Class A needs precise pointing; wheels also collect 2 Data per round.']);
      if (LW.riskOf(b.parts, b.orbit, false).risk > 1) needs.push([has('shielding') ? 'computer' : 'shielding', 'Class A: Risk must be 1, so add ' + (has('shielding') ? 'a backup computer.' : 'radiation shielding.')]);
    }
    if (st.made < st.used) needs.push([st.cells < st.cellSlots ? 'cells' : 'panels', 'Your parts use ' + st.used + ' W but you make ' + st.made + ' W.']);
  }
  const mine = needs.find(([k]) => LW.canBuy(G, pi, k));
  if (mine) return buy(mine[0], mine[1]);
  if (needs.length) { const k = needs[0][0], owner = LW.ownerOfRole(G, k); return end('Next the Flagship needs ' + LW.partCard(k).title + ', which is ' + LW.possessive(owner.name) + ' subsystem. If they are short of BC, send some with Trade.'); }
  const rv = LW.review(b.parts, b.missionId, b.orbit);
  if (!rv.ok) return { text: 'Design Review: fix the ✗ items in the checklist.', sel: '.review' };
  if (G.event === 'event-03') return end('Launch Delay: nobody can launch this round.');
  const lp = LW.launchPrice(G, b.orbit, pi), rk = LW.riskOf(b.parts, b.orbit, G.event === 'event-13');
  if (p.bc < lp.price) return end('The launch costs ' + lp.price + ' BC and you have ' + p.bc + '.' + (G.coop ? ' Any teammate can launch the Flagship, or send you BC with Trade.' : ''));
  const extras = [];
  if (!classA && !has('battery')) extras.push('a battery');
  if (!classA && !has('wheels') && !has('magnetorquers')) extras.push('reaction wheels or magnetorquers');
  const risky = 1 - rk.chance > .2 ? ' It is a risky launch, so insurance is worth it.' : '';
  return { text: 'Design Review passed. Launch chance is ' + Math.round(rk.chance * 100) + '%.' + (extras.length ? ' You can launch now, or first add ' + extras.join(' and ') + ' (+10 points each).' : ' Launch!') + risky, sel: '#launch' };
}

  }
  let out = p.missions.map(id => {
    const sat = LW.satForMission(G, id), building = p.build && p.build.missionId === id;
    const badge = sat ? (sat.status === 'pending' ? 'On the pad' : 'In orbit') : building ? 'Building' : 'Waiting';
    return `<div class="mission-slot">${cardImg(id, { badge, cls: building ? 'sel' : '' })}
      ${!sat && !building ? `<button class="btn small mustard" data-build="${esc(id)}">Build for this</button>` : ''}</div>`;
  }).join('');
  if (p.missions.length < LW.MAX_MISSIONS) out += `<div class="mission-slot"><button class="cardimg empty" id="takemission" ${canAct() ? '' : 'disabled'}><span><b>Take a mission</b><span style="font-size:12px">1 action · draw 2, keep 1</span></span></button></div>`;
  return out;
}
function buildBay(p) {
  const b = bld();
  if (!b && G.coop) return `<div class="bay"><h3 class="display">Build bay</h3><p class="sub">The Flagship is in flight. If it is lost at launch, the team starts a new one.</p></div>`;
  if (!b) return `<div class="bay"><h3 class="display">Build bay</h3><p class="sub">${p.missions.length ? 'All your missions have satellites in orbit. Take another mission to start a new build.' : 'Take a mission to start building a satellite.'}</p></div>`;
  const m = C(b.missionId), rv = LW.review(b.parts, b.missionId, b.orbit), st = rv.stats;
  const rk = LW.riskOf(b.parts, b.orbit, G.event === 'event-13');
  const lp = LW.launchPrice(G, b.orbit, curIdx());
  const dpr = LW.dataPerRound(b.parts, b.orbit, null).n;
  const rounds = LW.roundsToFinish(b.parts, b.orbit, m.rules.data);
  const locked = b.parts.length > 0;
  const orbBtns = LW.ORBIT_ORDER.filter(o => G.advanced || o !== 'mars').map(o => {
    const oc = LW.orbitCard(o), allowed = m.rules.orbits.includes(o);
    return `<button class="orbit-btn ${b.orbit === o ? 'on' : ''}" data-orbit="${o}" ${allowed && !locked ? '' : 'disabled'} title="${esc(oc.title)}"><span class="t">${esc(oc.title.replace('Sun-synchronous Orbit', 'Sun-sync (SSO)').replace('Low Earth Orbit', 'Low Earth (LEO)').replace('Geostationary Orbit', 'Geostationary'))}</span><span class="m">${oc.rules.launch} BC · Sun ${SUN_LABEL[oc.rules.sun]} · Risk ${oc.rules.risk}</span></button>`;
  }).join('');
  const costSoFar = st.cost + lp.price, budget = st.cost + p.bc, goal = G.coop ? m.rules.sp : G.winSP;
  // Will it finish in time? Launching now, operations run this round and every round after it.
  const left = LW.ROUNDS - G.round + 1;
  let late = '';
  if (rounds > left) {
    let d = m.rules.data; while (d > 0 && LW.roundsToFinish(b.parts, b.orbit, d) > left) d--;
    late = `<p class="warn">⚠ Needs about ${rounds > 8 ? 'more than 8' : rounds} rounds to finish, but only ${left} left if you launch now. ${G.coop ? 'The Flagship must finish to count, so add reaction wheels for 2 Data per round.' : `It would get about ${d} of ${m.rules.data} Data home: ${Math.floor(m.rules.sp * d / m.rules.data)} SP of partial science at the end.`}</p>`;
  }
  const ins = LW.insurance(G, b, curIdx()), insureWorth = 1 - rk.chance > .2;
  return `<div class="bay">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="eyebrow" style="color:#a0472a">Build bay</span><h3 class="display">${esc(m.title)}</h3><span class="sub">${esc(m.text)} Needs ${m.rules.data} Data · pays ${m.rules.sp} SP</span></div>
    <p class="key"><b>BC</b> budget · <b>SP</b> science points · <b>U</b> size (1U is a 10 cm cube) · <b>W</b> watts of power · <b>Data</b> what your instrument collects</p>
    <div class="orbits" role="group" aria-label="Orbit">${orbBtns}</div>
    ${locked ? '<p class="sub" style="margin:-4px 0 10px">Orbit locked: parts are installed.</p>' : '<p class="sub" style="margin:-4px 0 10px">Choosing the orbit is free until you install the first part.</p>'}
    <div class="bayrow">
      <div>
        ${chassis(b, st)}
        <ul class="partlist">${b.parts.map(x => `<li>${esc(C(x.cardId).title)} <button data-scrap="${x.uid}" aria-label="Scrap ${esc(C(x.cardId).title)}" ${G.phase === 'turns' && !G.pending ? '' : 'disabled'}>×</button></li>`).join('')}</ul>
        <div class="tradespace"><span class="eyebrow" style="color:var(--mustard)">Trade Space</span>
          ${tsRow('Cost', Math.min(1, costSoFar / Math.max(1, budget)), '#e2793a', costSoFar + ' BC', 'parts + launch, against ' + budget + ' BC you have had for it')}
          ${tsRow('Science', Math.min(1, m.rules.sp / goal), '#eab43b', m.rules.sp + ' SP', G.coop ? 'the whole team goal' : 'of the ' + goal + ' SP you need to win')}
          ${tsRow('Risk', 1 - rk.chance, '#e2603a', Math.round((1 - rk.chance) * 100) + '% fail', 'chance it is lost at the launch check')}
        </div>
      </div>
      <div>
        <div class="meters">
          <div class="meter ${st.volume > st.capacity ? 'warn' : ''}"><div class="k">Volume <span>used / fits</span></div><div class="v num">${st.volume}/${st.capacity} U</div></div>
          <div class="meter ${st.used > st.made ? 'warn' : ''}"><div class="k">Power <span>made / used</span></div><div class="v num">${st.made}/${st.used} W</div></div>
          <div class="meter"><div class="k">Launch <span>chance it works</span></div><div class="v num">${Math.round(rk.chance * 100)}%</div></div>
        </div>
        <p class="sub" style="margin:8px 0 0">Risk ${rk.risk}: ${rk.why.map(w => esc(w.label) + ' ' + (w.v > 0 ? '+' : '') + w.v).join(', ')}. Collects ${dpr} Data/round; about ${rounds > 8 ? 'too many' : rounds} round${rounds === 1 ? '' : 's'} to finish.</p>${late}
        <ul class="review">${rv.items.map(i => `<li><span class="${i.ok ? 'ok' : 'no'}">${i.ok ? '✓' : '✗'}</span>${esc(i.text)}</li>`).join('')}</ul>
        <div class="launchrow">
          <button class="btn go big" id="launch" ${canAct() && rv.ok && G.event !== 'event-03' ? '' : 'disabled'}>Launch · ${lp.price + (UI.insure ? ins.premium : 0)} BC</button>
          <span class="note">${G.event === 'event-03' ? 'Launch Delay: no launches this round.' : lp.rideshareWith != null ? 'Rideshare with ' + esc(G.players[lp.rideshareWith].name) + ': half price.' : rv.ok ? 'Design Review passed.' : 'Fix the ✗ items to launch.'}</span>
        </div>
        <label class="check insure"><input type="checkbox" id="insure" ${UI.insure ? 'checked' : ''}> Insure for ${ins.premium} BC: get ${ins.payout} BC back if it is lost at launch
          <small>${insureWorth ? 'Worth it here: the fail chance is above 20%.' : 'Probably not worth it: the fail chance is 20% or less.'} Real agencies insure launches the same way.</small></label>
      </div>
    </div>
  </div>`;
}
function tsRow(k, f, col, val, what) { return `<div class="ts-row" title="${esc(what || '')}"><span>${k}</span><span class="track"><span class="fillb" style="display:block;width:${Math.round(f * 100)}%;background:${col}"></span></span><span class="val">${val}</span></div>${what ? `<div style="font-size:11px;opacity:.65;margin:-2px 0 0 78px">${esc(what)}</div>` : ''}`; }
function chassis(b, st) {
  if (!st.frame) return `<div class="chassis"><div class="nf">No frame yet. Buy a <b>1U, 3U, 6U or 12U frame</b> from the Workshop shelf: it sets how much fits.</div></div>`;
  const cells = st.capacity * 2, cols = Math.min(6, cells);
  const blocks = [];
  b.parts.filter(x => !x.key.startsWith('frame') && (C(x.cardId).rules.volume || 0) > 0).forEach(x => {
    const n = Math.round(C(x.cardId).rules.volume * 2);
    for (let i = 0; i < n; i++) blocks.push({ label: i === 0 ? C(x.cardId).title : '', cat: CAT[x.key], fresh: UI.prevParts && !UI.prevParts.includes(x.uid) });
  });
  const ext = b.parts.filter(x => !x.key.startsWith('frame') && !(C(x.cardId).rules.volume > 0));
  let html = '';
  for (let i = 0; i < Math.max(cells, blocks.length); i++) {
    const bl = blocks[i];
    html += bl ? `<div class="cell fill cat-${bl.cat} ${bl.fresh ? 'pop' : ''}" ${i >= cells ? 'style="outline:2px solid var(--bad)"' : ''}>${esc(bl.label)}</div>` : '<div class="cell"></div>';
  }
  return `<div class="chassis"><div class="eyebrow" style="color:var(--paper);opacity:.75;margin-bottom:6px">${esc(C(st.frame.cardId).title)} · each slot is 0.5 U</div>
    <div class="chassis-grid" style="grid-template-columns:repeat(${cols},1fr)">${html}</div>
    ${ext.length ? `<div class="ext">${ext.map(x => `<span>${esc(C(x.cardId).title)} (outside)</span>`).join('')}</div>` : ''}</div>`;
}
function shelfItem(k, p) {
  const pc = LW.partCard(k), price = LW.partPrice(G, k);
  const ok = LW.canBuy(G, curIdx(), k);
  return `<button class="shelf-item" data-shelf="${k}" ${canAct() && bld() && ok ? '' : 'disabled'} title="${esc(ok ? partHelp(k) : 'Another agency\u2019s subsystem')}"><img src="${esc(pc.image)}" alt="" loading="lazy"><span class="t">${esc(pc.title)}</span><span class="m">${price} BC · ${k.startsWith('frame') ? pc.rules.capacity + ' U room, ' + pc.rules.cellSlots + ' cell' + (pc.rules.cellSlots > 1 ? 's' : '') : pc.rules.volume + ' U'} · ${pc.rules.power > 0 ? '+' : ''}${pc.rules.power} W</span></button>`;
}
function orbitMap(p) {
  const RAD = { leo: 36, sso: 50, geo: 70, lunar: 94, l2: 118, mars: 142 }, SHORT = { leo: 'LEO', sso: 'SSO', geo: 'GEO', lunar: 'Moon', l2: 'L2', mars: 'Mars' };
  const orbits = LW.ORBIT_ORDER.filter(o => G.advanced || o !== 'mars'), size = RAD[orbits[orbits.length - 1]] * 2 + 44, c = size / 2;
  const tb = bld(), target = tb && tb.orbit;
  let g = orbits.map((o, k) => {
    const a = (-72 + k * 10) * Math.PI / 180;
    return `<circle cx="${c}" cy="${c}" r="${RAD[o]}" class="ring ${o === target ? 'on' : ''}"/><text x="${(c + RAD[o] * Math.cos(a)).toFixed(1)}" y="${(c + RAD[o] * Math.sin(a) - 3).toFixed(1)}" class="rl ${o === target ? 'on' : ''}">${SHORT[o]}</text>`;
  }).join('');
  g += `<circle cx="${c}" cy="${c}" r="22" fill="#9db3cf"/><path d="M${c - 14} ${c - 6}q8 -10 16 -4q6 6 -2 12q-10 4 -14 -8zM${c + 2} ${c + 8}q8 -4 12 2q-4 8 -12 -2z" fill="#7fb8a6"/>`;
  g += `<circle cx="${(c - RAD.lunar * .7).toFixed(1)}" cy="${(c + RAD.lunar * .714).toFixed(1)}" r="6" fill="#fff1d8"/>`;
  if (G.advanced) g += `<circle cx="${(c - RAD.mars * .9).toFixed(1)}" cy="${(c - RAD.mars * .436).toFixed(1)}" r="6" fill="#e2603a"/>`;
  G.sats.filter(s => s.status === 'active' || s.status === 'pending').forEach((s, k) => {
    const r = RAD[s.orbit], col = PLAYER_COLORS[s.owner];
    g += `<g class="osat" style="transform-origin:${c}px ${c}px;animation-duration:${Math.round(10 + r / 3)}s;animation-delay:-${(k * 4.3).toFixed(1)}s"><title>${esc(G.players[s.owner].name + ': ' + C(s.missionId).title)}</title>${shapeSvg(s.owner, c + r, c, s.status === 'pending' ? '#312838' : col, col)}</g>`;
  });
  return `<div class="omap"><svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Orbit map, not to scale">${g}</svg>
    <div class="olegs">${orbits.map(o => `<button class="oleg ${o === target ? 'on' : ''}" data-zoom="${LW.orbitCard(o).id}"><b>${SHORT[o]}</b> ${esc(ORBIT_REAL[o][0])}</button>`).join('')}</div>
    <p class="empty-note" style="margin:6px 0 0;font-size:11px">Map not to scale; distances are real.${target ? ' Bright ring: the orbit you are building for.' : ''} Hollow: waiting for its launch check.${G.players.length > 1 ? ' ' + G.players.map((q, i) => mark(i) + ' ' + esc(q.name)).join(' · ') : ''}</p></div>`;
}
function tracker() {
  const live = G.sats.filter(s => s.status === 'active' || s.status === 'pending');
  if (!live.length) return '<p class="empty-note">Nothing in orbit yet. The first launch is the hardest.</p>';
  return `<div class="tracker">${live.map(s => {
    const m = C(s.missionId), need = m.rules.data, o = LW.orbitCard(s.orbit);
    const life = o.rules.lifetime ? ` · ${Math.max(0, o.rules.lifetime - s.opsRounds)} rounds before re-entry` : '';
    return `<div class="sat" style="--who:${PLAYER_COLORS[s.owner]}"><img src="${esc(m.image)}" alt=""><div>
      <div class="t">${esc(m.title)}</div><div class="o">${mark(s.owner)} ${esc(G.players[s.owner].name)} · ${esc(o.title)}${life}</div>
      <div class="dbar" title="${s.down} of ${need} Data downlinked, ${s.stored} stored"><span class="down" style="width:${Math.min(100, s.down / need * 100)}%"></span><span class="stored" style="width:${Math.min(100 - Math.min(100, s.down / need * 100), s.stored / need * 100)}%"></span></div>
      <span class="status ${s.status === 'pending' ? 'st-pending' : 'st-active'}">${s.status === 'pending' ? 'Launch check at end of round' : s.down + '/' + need + ' Data home'}</span></div></div>`;
  }).join('')}</div>`;
}
function bind() {
  const app = $('#app');
  app.onchange = e => { if (e.target.id === 'insure') { UI.insure = e.target.checked; renderGame(); } };
  app.onclick = e => {
    const t = e.target.closest('button, [data-zoom]'); if (!t || t.disabled) return;
    if (t.dataset.zoom) return zoom(t.dataset.zoom);
    if (t.id === 'endturn') return endTurn();
    if (t.id === 'rulesbtn') return showRules();
    if (t.id === 'cardsbtn') return showGallery();
    if (t.id === 'coachoff') { G.guide = false; save(); return renderGame(); }
    if (t.id === 'quitbtn') return confirmQuit();
    if (t.id === 'takemission') return doAct({ type: 'takeMission' });
    if (t.id === 'launch') { const r = doAct({ type: 'launch', insure: !!UI.insure }); if (r.ok) { UI.insure = false; renderGame(); } return; }
    if (t.id === 'tradebtn') return showTradeModal();
    if (t.id === 'sobtn') return showSpecialOrder();
    if (t.id === 'tsbtn') return showTradeChoice();
    if (t.dataset.build) return doAct({ type: 'selectBuild', missionId: t.dataset.build });
    if (t.dataset.orbit) return doAct({ type: 'setOrbit', orbit: t.dataset.orbit });
    if (t.dataset.shelf) return doAct({ type: 'buy', source: 'shelf', key: t.dataset.shelf });
    if (t.dataset.buy != null) return doAct({ type: 'buy', source: 'market', slot: +t.dataset.buy });
    if (t.dataset.scrap) return doAct({ type: 'scrap', uid: t.dataset.scrap });
  };
}
function confirmQuit() {
  modal({ title: 'Start a new game?', narrow: true, body: '<p class="lede">This game will be lost.</p>',
    foot: `<button class="btn" id="qno">Keep playing</button><button class="btn go" id="qyes">New game</button>` });
  $('#qno').onclick = closeModal;
  $('#qyes').onclick = () => { clearSave(); closeModal(); G = null; renderTitle(); };
}

// ---------- boot ----------
drawStars();
fetch('cards.json').then(r => r.json()).then(list => { CARDS = list; LW.loadCards(list); renderTitle(); })
  .catch(() => { $('#app').innerHTML = '<p style="padding:40px">Could not load the cards. Reload the page to try again.</p>'; });
</script>
</body>
</html>
